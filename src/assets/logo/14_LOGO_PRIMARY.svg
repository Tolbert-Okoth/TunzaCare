<svg viewBox="0 0 520 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .tunza { font-family:'Special Elite', 'Courier New', monospace; font-weight:400; }
      .care  { font-family:'Spectral', Georgia, serif; font-style:italic; font-weight:500; }
    </style>
  </defs>

  <!-- mark, reused at smaller scale -->
  <g transform="translate(6 10) scale(0.92) rotate(-6 60 60)">
    <path d="M 60 15
             C 82 15, 101 33, 102 56
             C 103 79, 86 100, 62 104
             C 39 108, 18 92, 16 68
             C 14 45, 30 21, 53 16
             C 55.5 15.6, 57.5 15.2, 60 15 Z"
          fill="none" stroke="#9C3B2A" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="34" fill="none" stroke="#2B2419" stroke-width="2.6"
            stroke-linecap="round" pathLength="100"
            stroke-dasharray="7 6.2" stroke-dashoffset="4"
            transform="rotate(18 60 60)"/>
    <circle cx="60" cy="26" r="3.1" fill="#2B2419"/>
    <circle cx="88" cy="72" r="3.1" fill="#2B2419"/>
    <circle cx="33" cy="74" r="3.1" fill="#2B2419"/>
    <circle cx="60" cy="60" r="7.5" fill="#3D6650"/>
  </g>

  <!-- wordmark: Tunza in the stamp face, Care in the literary face — the blend made visible -->
  <text x="150" y="70" class="tunza" font-size="46" fill="#2B2419" letter-spacing="0.5">Tunza</text>
  <text x="150" y="102" class="care" font-size="27" fill="#6B5F49">Care</text>

  <!-- small stitch rule under the wordmark, tying back to the ledger spine -->
  <line x1="151" y1="112" x2="330" y2="112" stroke="#C9BFA0" stroke-width="1.4" stroke-dasharray="4 4"/>
</svg>
